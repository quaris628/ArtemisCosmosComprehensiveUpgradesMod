
# Auto start will automatically start the mission when it is selected
AUTO_START: false

# Auto play is a special mode
# Typically used for testing
# But could be useful with 
# attracting attention
AUTO_PLAY:
    enable: false

#
# Operator mode is for operators
# It allows the main screen to display and image
# and remote starting of the game
#
OPERATOR_MODE: 
    enable: false
    logo: "media/LegendaryMissions/operator"
    show_logo_on_main: true
    pin: "000000"
    
    # Which console an operator admin client will show after the game starts.
    # For ship-specific consoles, the admin client will start on ship 1, and
    # if ship 1 gets destroyed, then the client will open the game results
    # screen if the game has ended or console selection if it has not ended.
    # If this console can't be selected by the admin client (it's either
    # invalid or locked), then the admin client will attempt to select the
    # gamemaster console, and if that fails too then it opens console selection.
    console_after_game_starts: gamemaster
    
    # When this is enabled, the server will show (almost) nothing on its screen.
    # This might be helpful for conserving computing resources on the machine
    # that's running the server, if you're only using an admin client instead.
    quasi_headless_server_mode: false

#
# Additional Lock down settings
#
# Even if it is set to read-only here, the server and operator
# admin clients will always be able to edit player ships.
SHIP_PICK_READ_ONLY: false

# Currently, this setting is not respected
CAN_CHANGE_CONSOLE: true
# TODO figure out how to specify which client should be which console(s)
# (Perhaps reading from client_string_set.txt but never programatically
# writing to it will avoid triggering its data corruption bugs?)

