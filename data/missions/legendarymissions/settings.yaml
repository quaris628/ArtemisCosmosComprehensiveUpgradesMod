# Use Brain based Damcons
# This is a temporary setting 
# The old version will be removed
# after further play testing
NEW_DAMCONS: true

GAMEMASTER:
    # Even if it is disabled here, operator admin clients
    # will always have access to the gamemaster console.
    enable: true
    beta: false
    menu_icon_size: 45 # Pixels
    # Uncomment the pin if you want to require one to enter the gamemaster console.
    # If a client has already had the operator mode pin entered in, then it will
    # not require entering a pin again in order to enter the gamemaster console.
    #pin: "000000"

#
# These are the settings 
# for standard docking
#    
DOCKING: 
    refuel_amount: 100
    refuel_delay: 1
    shield_delay: 1
    shield_coeff: 1
    torps_delay: 2
    interior_delay: 1
    interior_count: 1

# These control what the mainscreen shows when the game starts
# Valid options for view: "3d_view", "lrs", "tactical", "data"
DEFAULT_MAINSCREEN_VIEW: "3d_view"
# Valid options for facing: "front", "back", "left", "right"
DEFAULT_MAINSCREEN_FACING: "front"
# Valid options for mode: "first_person", "chase", "tracking"
DEFAULT_MAINSCREEN_MODE: "chase"
# A default facing and mode should always be specified, even if the default view
# is not the 3d view!
# Why:
# When a player switches to the 3d view for the first time, they can only do
# so by pressing a button that selects either a facing or a mode; never both.
# So if a player switches to the 3d view for the first time by selecting a facing,
# then the mode will be the above default. And if a player switches to the 3d view
# for the first time by selecting a mode, then the facing will be the above default.

