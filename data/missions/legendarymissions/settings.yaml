# Console settings
CONSOLE_EXCLUSIVITIES:
    # Set to true to make the console only allow one person to take it at a time
    
    # ship-specific consoles
    helm: true
    weapons: true
    engineering: true
    science: true
    comms: true
    mainscreen: false
    cinematic: false
    display_panels: false
    
    # ship-agnostic consoles
    hangar: false
    gamemaster: true
    admiral: true
    
    # If you're creating a custom console, you should add it to the above list.
    # If a console isn't on this list, then it's assumed to be non-exclusive.

# TODO setting for whether to warn vs. prevent when 2 clients try to acquire the same console
# doing it with per-console granularity seems best

# Makes the skybox background in the console selection, game setup,
# game results, customize ship, etc. screens slowly scroll horizontally.
# Unfortunately, enabling this seems to cause intermittent crashes.
ENABLE_ANIMATED_SKYBOX_BACKGROUND_HACK: false

# Allow starting a new game without requiring the mission script to be restarted.
# Currently runs into a lot of crashes and is intended for developer use only.
# The hope is to eventually get this working well enough to be enabled by default.
ENABLE_NEW_GAME_WO_SCRIPT_RESTART: false
